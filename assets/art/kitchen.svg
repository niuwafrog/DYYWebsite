<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="厨房占位图">
  <defs>
    <pattern id="tiles" width="76" height="76" patternUnits="userSpaceOnUse">
      <rect width="76" height="76" fill="#e6e0cf"/>
      <path d="M0 76h76M76 0v76" stroke="#d3c9b2" stroke-width="3"/>
      <path d="M0 0h76v76" fill="none" stroke="#efe9da" stroke-width="2"/>
    </pattern>
    <linearGradient id="floorK" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a68d"/><stop offset="1" stop-color="#a08d76"/>
    </linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfc3c0"/><stop offset="1" stop-color="#9ea39f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#tiles)"/>
  <rect y="560" width="1600" height="340" fill="url(#floorK)"/>
  <g stroke="#7d6a54" stroke-opacity=".16" stroke-width="3">
    <line x1="0" y1="650" x2="1600" y2="650"/>
    <line x1="0" y1="760" x2="1600" y2="760"/>
  </g>
  <rect y="548" width="1600" height="16" fill="#8d7156"/>

  <!-- 门（回客厅） -->
  <g>
    <rect x="30" y="300" width="170" height="322" fill="#a97f57"/>
    <rect x="42" y="314" width="146" height="132" fill="#9a7350"/>
    <rect x="42" y="462" width="146" height="146" fill="#9a7350"/>
    <circle cx="184" cy="462" r="9" fill="#e3d2b4"/>
  </g>

  <!-- 灶台 -->
  <g>
    <!-- 抽油烟机 -->
    <path d="M300 150h240l-30 120H330z" fill="url(#hood)"/>
    <rect x="386" y="270" width="68" height="40" fill="#9ea39f"/>
    <rect x="300" y="140" width="240" height="16" rx="4" fill="#b0b5b1"/>
    <!-- 灶台柜体 -->
    <rect x="230" y="470" width="410" height="20" rx="4" fill="#cfc7b4"/>
    <rect x="230" y="490" width="410" height="190" fill="#b49b7c"/>
    <rect x="248" y="512" width="176" height="66" rx="6" fill="#a68d6e"/>
    <rect x="440" y="512" width="182" height="66" rx="6" fill="#a68d6e"/>
    <rect x="248" y="596" width="176" height="66" rx="6" fill="#a68d6e"/>
    <rect x="440" y="596" width="182" height="66" rx="6" fill="#a68d6e"/>
    <circle cx="424" cy="545" r="5" fill="#6d5a44"/>
    <circle cx="424" cy="629" r="5" fill="#6d5a44"/>
    <circle cx="448" cy="545" r="5" fill="#6d5a44"/>
    <circle cx="448" cy="629" r="5" fill="#6d5a44"/>
    <!-- 灶眼 -->
    <ellipse cx="420" cy="470" rx="104" ry="20" fill="#4a4440"/>
    <!-- 铁锅 -->
    <path d="M330 400c6 48 42 70 90 70s84-22 90-70z" fill="#3d3a37"/>
    <rect x="318" y="392" width="204" height="16" rx="8" fill="#4f4b47"/>
    <path d="M330 400c6-8 22-12 40-12" stroke="#6b6660" stroke-width="4" fill="none"/>
    <!-- 蒸汽 -->
    <g stroke="#f4efe4" stroke-width="9" stroke-linecap="round" opacity=".55" fill="none">
      <path d="M388 372c-12-22 12-34 0-56"/>
      <path d="M432 364c-12-24 12-36 0-60"/>
      <path d="M474 374c-10-20 10-32 0-52"/>
    </g>
    <!-- 锅铲挂杆 -->
    <rect x="250" y="300" width="180" height="6" rx="3" fill="#8d7156"/>
    <rect x="278" y="306" width="6" height="60" fill="#8d7156"/>
    <rect x="312" y="306" width="6" height="76" fill="#8d7156"/>
    <rect x="352" y="306" width="6" height="54" fill="#8d7156"/>
  </g>

  <!-- 窗 + 水池 -->
  <g>
    <rect x="690" y="110" width="320" height="246" rx="4" fill="#a87f56"/>
    <rect x="706" y="126" width="288" height="214" fill="#e5efeb" opacity=".95"/>
    <line x1="850" y1="126" x2="850" y2="340" stroke="#a87f56" stroke-width="10"/>
    <line x1="706" y1="230" x2="994" y2="230" stroke="#a87f56" stroke-width="10"/>
    <rect x="676" y="352" width="348" height="14" fill="#c29a70"/>
    <!-- 水池台面 -->
    <rect x="690" y="392" width="320" height="22" rx="4" fill="#cfc7b4"/>
    <rect x="706" y="414" width="288" height="56" fill="#b49b7c"/>
    <rect x="748" y="398" width="204" height="40" rx="8" fill="#b3bdb9"/>
    <rect x="762" y="404" width="176" height="28" rx="6" fill="#a3aeaa"/>
    <path d="M850 398v-38c0-10 16-10 16 0v38" stroke="#8d9793" stroke-width="8" fill="none" stroke-linecap="round"/>
    <rect x="862" y="360" width="8" height="10" fill="#8d9793"/>
    <!-- 窗台上的小罐 -->
    <rect x="712" y="336" width="30" height="18" rx="3" fill="#d9c3a0" stroke="#a8855c" stroke-width="2"/>
    <rect x="756" y="330" width="24" height="24" rx="3" fill="#c9a06f" stroke="#a8855c" stroke-width="2"/>
  </g>

  <!-- 桌子 -->
  <g>
    <rect x="620" y="556" width="342" height="18" rx="4" fill="#b0885c"/>
    <rect x="640" y="574" width="18" height="182" fill="#9a7750"/>
    <rect x="924" y="574" width="18" height="182" fill="#9a7750"/>
    <rect x="640" y="672" width="302" height="10" fill="#a07a52"/>
    <!-- 桌上的东西：案板 + 面团 -->
    <ellipse cx="726" cy="548" rx="62" ry="14" fill="#c8a271"/>
    <circle cx="714" cy="536" r="18" fill="#f0e4cd"/>
    <circle cx="742" cy="540" r="14" fill="#f0e4cd"/>
    <!-- 暖水瓶 -->
    <rect x="898" y="470" width="56" height="88" rx="14" fill="#c2584a"/>
    <rect x="898" y="510" width="56" height="26" fill="#d87769" opacity=".7"/>
    <rect x="906" y="458" width="40" height="14" rx="6" fill="#8d5a4a"/>
    <rect x="916" y="450" width="20" height="10" rx="4" fill="#6f4a3d"/>
    <ellipse cx="926" cy="490" rx="14" ry="9" fill="#f0e4cd" opacity=".55"/>
    <!-- 两个碗 -->
    <path d="M806 556c0-14 12-24 26-24s26 10 26 24z" fill="#e7dcc6"/>
    <path d="M862 556c0-12 10-20 22-20s22 8 22 20z" fill="#ded2ba"/>
  </g>

  <!-- 碗柜 -->
  <g>
    <rect x="1052" y="206" width="392" height="470" fill="#a67f56"/>
    <rect x="1064" y="218" width="368" height="180" fill="#8a6440"/>
    <rect x="1074" y="228" width="348" height="160" fill="#c9b28c"/>
    <g stroke="#9d8462" stroke-width="3">
      <line x1="1322" y1="228" x2="1322" y2="388"/>
      <line x1="1248" y1="240" x2="1248" y2="300"/>
      <line x1="1248" y1="386" x2="1248" y2="336"/>
    </g>
    <!-- 柜门 -->
    <rect x="1064" y="408" width="180" height="256" fill="#b08a5e"/>
    <rect x="1256" y="408" width="176" height="256" fill="#b08a5e"/>
    <rect x="1078" y="422" width="152" height="228" fill="#a37d54"/>
    <rect x="1270" y="422" width="148" height="228" fill="#a37d54"/>
    <circle cx="1228" cy="540" r="7" fill="#e3d2b4"/>
    <circle cx="1272" cy="540" r="7" fill="#e3d2b4"/>
    <!-- 柜顶的罐子 -->
    <rect x="1080" y="162" width="48" height="44" rx="4" fill="#d9c3a0" stroke="#a8855c" stroke-width="2"/>
    <rect x="1142" y="150" width="54" height="56" rx="5" fill="#c9a06f" stroke="#a8855c" stroke-width="2"/>
    <rect x="1210" y="168" width="44" height="38" rx="4" fill="#e0cda9" stroke="#a8855c" stroke-width="2"/>
    <rect x="1268" y="156" width="58" height="50" rx="5" fill="#b8a17d" stroke="#a8855c" stroke-width="2"/>
    <rect x="1340" y="172" width="46" height="34" rx="4" fill="#d3bb95" stroke="#a8855c" stroke-width="2"/>
    <rect x="1398" y="164" width="38" height="42" rx="4" fill="#cbb28d" stroke="#a8855c" stroke-width="2"/>
  </g>

  <!-- 奶奶（站在灶台前） -->
  <g>
    <path d="M438 700c0-58 20-92 44-92s44 34 44 92z" fill="#8f7f9c"/>
    <path d="M446 700c0-52 16-84 36-84s36 32 36 84z" fill="#a294ac"/>
    <rect x="462" y="586" width="40" height="22" rx="10" fill="#e6c3a6"/>
    <circle cx="482" cy="556" r="34" fill="#e8c6a8"/>
    <path d="M450 546c2-22 16-36 32-36s30 14 32 36c-8-10-18-16-32-16s-24 6-32 16z" fill="#dcd6ca"/>
    <circle cx="470" cy="554" r="2.8" fill="#4a3f37"/>
    <circle cx="494" cy="554" r="2.8" fill="#4a3f37"/>
    <path d="M474 572c5 4 12 4 17 0" stroke="#b98a72" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="446" cy="628" rx="12" ry="10" fill="#e8c6a8"/>
    <ellipse cx="518" cy="628" rx="12" ry="10" fill="#e8c6a8"/>
  </g>

  <!-- 地上的小凳子 + 菜篮 -->
  <g>
    <rect x="1210" y="726" width="86" height="12" rx="4" fill="#a07a52"/>
    <rect x="1216" y="738" width="10" height="42" fill="#8a6440"/>
    <rect x="1280" y="738" width="10" height="42" fill="#8a6440"/>
    <path d="M1330 780c0-26 20-46 44-46s44 20 44 46z" fill="#b99a6a"/>
    <path d="M1356 736c-6-16 6-26 18-26s24 10 18 26" stroke="#9c7f52" stroke-width="6" fill="none"/>
    <circle cx="1374" cy="726" r="14" fill="#7f9161"/>
    <circle cx="1392" cy="732" r="11" fill="#8fa06e"/>
  </g>

  <g font-family="Georgia, serif" font-size="17" fill="#6f5b46" opacity=".55">
    <text x="430" y="352" text-anchor="middle">灶台</text>
    <text x="790" y="628" text-anchor="middle">木桌</text>
    <text x="1248" y="706" text-anchor="middle">碗柜</text>
    <text x="848" y="376" text-anchor="middle">水池</text>
    <text x="112" y="640" text-anchor="middle">← 客厅</text>
    <text x="926" y="450" text-anchor="middle">暖水瓶</text>
  </g>
  <g font-family="Georgia, serif" font-size="15" fill="#7d6a56" opacity=".5">
    <text x="1590" y="884" text-anchor="end">占位图 · 3200×1800 导出后替换 assets/art/kitchen.*</text>
  </g>
</svg>
