<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="客厅占位图">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e6d0"/><stop offset="1" stop-color="#ded0b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef5f1"/><stop offset="1" stop-color="#cddfdb"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".2" r=".9">
      <stop offset="0" stop-color="#fff6dd" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff6dd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8a684"/><stop offset="1" stop-color="#b18f6d"/>
    </linearGradient>
  </defs>

  <!-- 墙 / 地 -->
